name: FNR-001 dual-firmware foundation
on:
  push:
    branches: [main, fnr-001-dual-firmware-ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-style:
    name: Text and style sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whitespace and source integrity
        shell: bash
        run: |
          git diff --check "${{ github.event.pull_request.base.sha || 'HEAD~1' }}" HEAD
          python3 -m compileall -q tools
          python3 -m json.tool dependencies.lock.json >/dev/null
          if git grep -nI -E -e '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----' -- .; then
            echo "Unexpected private key material is tracked" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib
          lock = json.loads(pathlib.Path("dependencies.lock.json").read_text())
          assert lock["schema_version"] == 1
          assert len(lock["sources"]) == 4
          assert len(lock["artifacts"]) == 4
          for entry in lock["sources"]:
              assert len(entry["commit"]) == 40
          for entry in lock["artifacts"]:
              assert len(entry["sha256"]) == 64
          print("PASS: pinned sources, artifact hashes, Python syntax")
          PY

  native:
    name: Native tests (UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all"
      - name: Compile
        run: cmake --build build/native --parallel 2
      - name: Test
        run: ctest --test-dir build/native --output-on-failure

  rp2040:
    name: RP2040 locked cross-build (inert)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Acquire exact dependencies
        run: python3 tools/acquire_deps.py --lane rp2040
      - name: Cross-compile
        run: bash tools/build_rp2040.sh
      - name: Record UF2 hashes and manifest
        env:
          FNR_SOURCE_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -s build/rp2040/fnr_rp2040_inert.uf2
          test -s build/rp2040/fnr_rp2040_inert.elf
          sha256sum build/rp2040/fnr_rp2040_inert.uf2 build/rp2040/fnr_rp2040_inert.elf > build/rp2040/SHA256SUMS
          python3 tools/artifact_manifest.py --lane rp2040 --source-id "$FNR_SOURCE_ID" \
            --compiler .deps/arm/bin/arm-none-eabi-gcc \
            --config tools/manifest-config.rp2040.json \
            --output build/rp2040/manifest.json \
            build/rp2040/fnr_rp2040_inert.uf2 build/rp2040/fnr_rp2040_inert.elf
          python3 -m json.tool build/rp2040/manifest.json >/dev/null
          cat build/rp2040/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fnr-001-rp2040-inert
          path: |
            build/rp2040/fnr_rp2040_inert.uf2
            build/rp2040/fnr_rp2040_inert.elf
            build/rp2040/SHA256SUMS
            build/rp2040/manifest.json

  esp8266:
    name: ESP8266 locked cross-build (radio ingress)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Acquire exact dependencies
        run: python3 tools/acquire_deps.py --lane esp
      - name: Cross-compile
        env:
          FNR_SOURCE_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tools/build_esp.sh
      - name: Record image hashes and manifest
        env:
          FNR_SOURCE_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -s build/esp8266/fnr_esp8266_ingress.bin
          test -s build/esp8266/fnr_esp8266_ingress.elf
          .deps/xtensa/bin/xtensa-lx106-elf-nm build/esp8266/fnr_esp8266_ingress.elf | grep -q 'esp_now_register_recv_cb'
          sha256sum build/esp8266/fnr_esp8266_ingress.bin build/esp8266/fnr_esp8266_ingress.elf > build/esp8266/SHA256SUMS
          python3 tools/artifact_manifest.py --lane esp --source-id "$FNR_SOURCE_ID" \
            --compiler .deps/xtensa/bin/xtensa-lx106-elf-gcc \
            --config tools/manifest-config.esp8266.json \
            --output build/esp8266/manifest.json \
            build/esp8266/fnr_esp8266_ingress.bin build/esp8266/fnr_esp8266_ingress.elf
          python3 -m json.tool build/esp8266/manifest.json >/dev/null
          cat build/esp8266/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fnr-004-esp8266-ingress
          path: |
            build/esp8266/*.bin
            build/esp8266/*.elf
            build/esp8266/SHA256SUMS
            build/esp8266/manifest.json
