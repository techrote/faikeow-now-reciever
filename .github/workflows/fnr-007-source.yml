name: FNR-007 baseline source snapshot
on:
  push:
    branches: [fnr-007-provisioning]
    paths: [.github/workflows/fnr-007-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Archive pinned baseline without secrets or workspace files
        run: |
          git archive --format=tar 136ef3b612f83fd9cad74a5dd50c2e5f629b44de > fnr-baseline.tar
          git branch snapshot-base 136ef3b612f83fd9cad74a5dd50c2e5f629b44de
          git bundle create fnr-baseline.bundle snapshot-base
          sha256sum fnr-baseline.tar fnr-baseline.bundle > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fnr-007-baseline-source
          retention-days: 3
          path: |
            fnr-baseline.tar
            fnr-baseline.bundle
            SHA256SUMS
